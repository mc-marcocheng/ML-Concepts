name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ROOT_DIR: ml-concepts   # set to "." if package.json is at the repo root

jobs:
  verify:
    name: Validate, typecheck, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.ROOT_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.ROOT_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate MDX frontmatter and quiz YAML
        run: npm run content:validate

      - name: Build content + search index
        run: npm run content:build

      - name: Lint and typecheck
        run: npm run lint

      - name: Build (static export smoke test)
        run: npx next build

      - name: Assert export output exists
        run: test -f out/index.html && test -f out/data/concepts.json
