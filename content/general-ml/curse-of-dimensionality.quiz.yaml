- id: cod-short-1
  type: short
  prompt: "Why do many high dimensional datasets still allow good models?"
  difficulty: 3
  answer: "Real data often lies near a low dimensional manifold, so the intrinsic dimension is much smaller than the ambient dimension. Structural priors and regularization exploit this."
  rubric:
    - "Mentions the manifold hypothesis or low intrinsic dimension."
    - "Mentions priors, structure, or regularization."
  explanation: "The effective dimension drives sample complexity, not the raw feature count."
  anchor: why-real-data-still-works
