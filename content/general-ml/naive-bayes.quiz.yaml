- id: nb-short-1
  type: short
  prompt: "Why use log probabilities in naive Bayes?"
  difficulty: 3
  answer: "Logs avoid numerical underflow and turn products of probabilities into sums."
  rubric:
    - "Mentions numerical underflow."
    - "Mentions products become sums."
  explanation: "Multiplying many small probabilities can underflow."
  anchor: prediction-rule

