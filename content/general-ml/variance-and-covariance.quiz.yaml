- id: varcov-mcq-1
  type: mcq
  prompt: "What does variance measure?"
  difficulty: 1
  options:
    - "Average squared distance from the mean"
    - "Probability of the most likely value"
    - "The number of samples"
    - "The largest covariance"
  correctIndex: 0
  explanation: "Variance is the expected squared distance from the mean."
  anchor: core-idea
- id: varcov-latex-1
  type: latex
  prompt: "Write the identity for variance in terms of $\\mathbb{E}[X^2]$ and $\\mathbb{E}[X]$."
  difficulty: 2
  answer: "\\mathbb{E}[X^2] - \\mathbb{E}[X]^2"
  rubric:
    - "Includes the second moment."
    - "Subtracts the square of the mean."
  explanation: "The identity is $\\operatorname{Var}(X)=\\mathbb{E}[X^2]-\\mathbb{E}[X]^2$."
  anchor: useful-variance-identity
- id: varcov-short-1
  type: short
  prompt: "Does zero covariance always imply independence?"
  difficulty: 3
  answer: "No. Zero covariance only means no linear association in general. It does not always imply independence."
  rubric:
    - "States that zero covariance does not always imply independence."
    - "Mentions that covariance measures linear association."
  explanation: "Some dependent variables have zero covariance."
  anchor: covariance-signs
- id: varcov-numeric-1
  type: numeric
  prompt: "For values 1, 2, and 3, what is the unbiased sample variance?"
  difficulty: 2
  value: 1
  tolerance: 0.000001
  explanation: "The mean is 2. The squared deviations sum to 2. Divide by $n-1=2$ to get 1."
  anchor: sample-estimates
- id: varcov-code-1
  type: code
  lang: python
  prompt: "Fill in the covariance matrix computation."
  difficulty: 3
  scaffold: |
    import numpy as np
    X = np.array([[1., 2.], [2., 1.], [3., 4.]])
    centered = X - X.mean(axis=0)
    cov = ___
  blanks:
    - id: 1
      answer: "centered.T @ centered / (len(X) - 1)"
      rubric:
        - "Uses centered data."
        - "Computes the matrix product centered.T @ centered."
        - "Divides by n minus one."
  explanation: "The sample covariance matrix uses centered data and the $n-1$ divisor."
  anchor: code-example
- id: varcov-mcq-2
  type: mcq
  prompt: "Why is a covariance matrix positive semi-definite?"
  difficulty: 4
  options:
    - "Because all entries are positive"
    - "Because its determinant is always one"
    - "Because every quadratic form equals an expected square"
    - "Because covariance implies independence"
  correctIndex: 2
  explanation: "For any vector $a$, $a^\\top\\Sigma a = \\mathbb{E}[((X-\\mu)^\\top a)^2] \\ge 0$."
  anchor: covariance-matrix
