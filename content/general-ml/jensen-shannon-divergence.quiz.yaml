- id: js-mcq-1
  type: mcq
  prompt: "What distribution does Jensen-Shannon divergence use between $p$ and $q$?"
  difficulty: 2
  options:
    - "The product $pq$"
    - "The mixture $(p+q)/2$"
    - "Only $p$"
    - "Only $q$"
  correctIndex: 1
  explanation: "Jensen-Shannon divergence compares each distribution to the mixture $m=(p+q)/2$."
  anchor: core-idea
- id: js-latex-1
  type: latex
  prompt: "Write the mixture distribution $m$ used in Jensen-Shannon divergence."
  difficulty: 1
  answer: "\\frac{1}{2}(p+q)"
  rubric:
    - "Averages the two distributions."
    - "Includes both p and q."
  explanation: "The mixture is $m=\\frac{1}{2}(p+q)$."
  anchor: core-idea
- id: js-short-1
  type: short
  prompt: "Why is Jensen-Shannon divergence symmetric?"
  difficulty: 3
  answer: "It compares both distributions to the same mixture, and the mixture does not change when p and q are swapped."
  rubric:
    - "Mentions the shared mixture distribution."
    - "States that swapping p and q does not change the result."
  explanation: "The mixture $m=(p+q)/2$ is unchanged by swapping $p$ and $q$."
  anchor: symmetry
