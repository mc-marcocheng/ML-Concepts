  prompt: "For $z=xW+b$, write the gradient with respect to $x$ from upstream gradient $g_z$."
  difficulty: 3
  answer: 'g_z W^\top'
  rubric:
    - "Uses the upstream gradient."
    - "Multiplies by $W^\\top$."
  explanation: "The input gradient for a linear layer is $g_z W^\\top$."
