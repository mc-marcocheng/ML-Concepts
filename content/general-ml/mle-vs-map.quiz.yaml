- id: mle-map-short-1
  type: short
  prompt: "How can a prior act like regularization?"
  difficulty: 3
  answer: "The log prior adds a penalty or preference over parameters in the optimization objective."
  rubric:
    - "Mentions log prior."
    - "Mentions penalty or preference."
  explanation: "For example, a Gaussian prior leads to an L2 penalty."
  anchor: link-to-regularization

