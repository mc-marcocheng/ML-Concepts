- id: bv-mcq-1
  type: mcq
  prompt: "Which term measures sensitivity to the training sample?"
  difficulty: 2
  options:
    - "Bias"
    - "Variance"
    - "Noise"
    - "Evidence"
  correctIndex: 1
  explanation: "Variance measures how much the fitted model changes across training samples."
