- id: bv-latex-1
  type: latex
  prompt: "Write the bias-variance-noise decomposition for squared loss."
  difficulty: 4
  answer: '\operatorname{Bias}[\hat f(x)]^2+\operatorname{Var}[\hat f(x)]+\sigma^2'
  rubric:
    - "Includes squared bias."
    - "Includes estimator variance."
    - "Includes irreducible noise."
  explanation: "Expected squared error decomposes into squared bias, variance, and noise."
  anchor: core-idea

- id: bv-short-1
  type: short
  prompt: "Why can regularization increase bias while reducing variance?"
  difficulty: 3
  answer: "Regularization restricts the model, so it becomes less sensitive to data but can become less flexible."
  rubric:
    - "Mentions restriction or penalty."
    - "Mentions lower sample sensitivity."
    - "Mentions possible loss of flexibility."
  explanation: "A restricted model can generalize better but fit less detail."
  anchor: common-controls

- id: bv-mcq-2
