- id: clu-order-1
  type: order
  prompt: "Order the steps of Lloyd's algorithm for k-means."
  difficulty: 1
  steps:
    - "Initialize the centroids"
    - "Assign each point to its nearest centroid"
    - "Recompute each centroid as the mean of its points"
    - "Repeat until the assignments stop changing"
  explanation: "k-means alternates assignment and update."
  anchor: lloyds-algorithm
- id: clu-latex-1
  type: latex
  prompt: "Write the k-means objective for assignments $c_i$ and centroids $\\mu_k$."
  difficulty: 2
  answer: "\\sum_{i=1}^{n}\\|x_i - \\mu_{c_i}\\|^2"
  rubric:
    - "Sums over all points."
    - "Uses the squared distance to the assigned centroid."
  explanation: "k-means minimizes total within cluster squared distance."
  anchor: k-means-objective
- id: clu-mcq-1
  type: mcq
  prompt: "Which clustering method needs no value of $K$ and can label outliers as noise?"
  difficulty: 2
  options:
    - "k-means"
    - "Gaussian mixture model with EM"
    - "DBSCAN"
    - "Ward linkage cut at level K"
  correctIndex: 2
  explanation: "DBSCAN uses a radius and a minimum count, and it marks unreachable points as noise."
  anchor: dbscan
- id: clu-mcq-2
  type: mcq
  prompt: "In what limit does a Gaussian mixture model reduce to k-means?"
  difficulty: 4
  options:
    - "When the mixture weights are equal"
    - "When the covariances are shared, spherical, and shrink to zero"
    - "When the number of components goes to infinity"
    - "When the data is standardized"
  correctIndex: 1
  explanation: "Shrinking a shared spherical covariance makes responsibilities hard assignments."
  anchor: gaussian-mixture-models
- id: clu-short-1
  type: short
  prompt: "Why does k-means fail on two concentric rings?"
  difficulty: 3
  answer: "k-means assumes clusters are spherical blobs around a centroid in Euclidean distance. Concentric rings share a centroid, so no centroid pair separates them."
  rubric:
    - "Mentions the spherical or centroid based assumption."
    - "Explains that the rings are not separable by nearest centroid."
  explanation: "Spectral or density based methods handle such shapes."
  anchor: assumptions-and-failure-cases
- id: clu-numeric-1
  type: numeric
  prompt: "A point has mean intra-cluster distance $a=2$ and mean nearest-cluster distance $b=5$. What is its silhouette score?"
  difficulty: 2
  value: 0.6
  tolerance: 0.0001
  explanation: "The score is $(5-2)/\\max(2,5)=3/5$."
  anchor: choosing-k
- id: clu-code-1
  type: code
  lang: python
  prompt: "Fill in the assignment step and the centroid update for k-means."
  difficulty: 3
  scaffold: |
    d = ((X[:, None, :] - centers[None, :, :]) ** 2).sum(-1)
    labels = ___
    new_center_j = ___
  blanks:
    - id: 1
      answer: "d.argmin(1)"
      rubric:
        - "Selects the nearest centroid index per point."
    - id: 2
      answer: "X[labels == j].mean(0)"
      rubric:
        - "Averages the points assigned to cluster j."
  explanation: "Nearest centroid assignment then mean update."
  anchor: code-example
- id: clu-short-2
  type: short
  prompt: "What problem does k-means++ solve and how?"
  difficulty: 3
  answer: "Random initialization can converge to a poor local minimum. k-means++ picks each new center with probability proportional to the squared distance to the nearest chosen center, which spreads the seeds."
  rubric:
    - "States the poor local minimum problem."
    - "Describes distance squared proportional sampling."
  explanation: "The seeding gives an expected objective within a log K factor of optimal."
  anchor: k-means-initialization
