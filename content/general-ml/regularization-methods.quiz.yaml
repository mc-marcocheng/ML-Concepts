- id: reg-mcq-1
  type: mcq
  prompt: "What is the main purpose of regularization?"
  difficulty: 1
  options:
    - "Increase overfitting"
    - "Control model complexity"
    - "Remove the loss function"
    - "Guarantee zero training error"
  correctIndex: 1
  explanation: "Regularization controls model complexity and can improve generalization."
  anchor: core-idea

- id: reg-latex-1
  type: latex
  prompt: "Write an objective with data loss plus a regularization penalty."
  difficulty: 2
  answer: 'L_{\text{data}}(\theta)+\lambda R(\theta)'
  rubric:
    - "Includes a data loss."
    - "Includes a penalty term."
    - "Includes a regularization strength."
  explanation: "A regularized objective adds a penalty to the data loss."
  anchor: core-idea

- id: reg-short-1
  type: short
  prompt: "What is one difference between L1 and L2 regularization?"
  difficulty: 3
  answer: "L1 can drive weights exactly to zero, while L2 usually shrinks weights smoothly."
  rubric:
    - "Mentions sparsity for L1."
    - "Mentions smooth shrinkage for L2."
  explanation: "L1 is often useful for sparse feature selection."
  anchor: l1-regularization

- id: reg-mcq-2
  type: mcq
  prompt: "Which method stops training when validation performance stops improving?"
  difficulty: 1
  options:
    - "Early stopping"
    - "K-means"
    - "AUC"
    - "Bayes theorem"
  correctIndex: 0
  explanation: "Early stopping uses validation performance to select a training point."
