- id: bayes-mcq-1
  type: mcq
  prompt: "In Bayes' theorem, what is $p(A)$ called?"
  difficulty: 1
  options:
    - "Posterior"
    - "Likelihood"
    - "Prior"
    - "Evidence"
  correctIndex: 2
  explanation: "$p(A)$ is the prior."
  anchor: core-idea
- id: bayes-latex-1
  type: latex
  prompt: "Write Bayes' theorem for $p(A \\mid B)$."
  difficulty: 2
  answer: "\\frac{p(B \\mid A)p(A)}{p(B)}"
  rubric:
    - "Includes the likelihood $p(B \\mid A)$."
    - "Includes the prior $p(A)$."
    - "Divides by the evidence $p(B)$."
  explanation: "Bayes' theorem is $p(A \\mid B)=\\frac{p(B \\mid A)p(A)}{p(B)}$."
  anchor: core-idea
- id: bayes-numeric-1
  type: numeric
  prompt: "A disease has prior 0.01. A test has sensitivity 1.0 and false positive rate 0.09. What is $p(\\text{disease} \\mid \\text{positive})$?"
  difficulty: 3
  value: 0.101010101
  tolerance: 0.000001
  explanation: "The evidence is $1.0\\cdot0.01 + 0.09\\cdot0.99 = 0.0991$. The posterior is $0.01/0.0991$."
  anchor: base-rates
- id: bayes-short-1
  type: short
  prompt: "Why does the evidence term appear in Bayes' theorem?"
  difficulty: 3
  answer: "The evidence normalizes the likelihood times prior so the posterior probabilities sum or integrate to one."
  rubric:
    - "Mentions normalization."
    - "Mentions that the posterior must sum or integrate to one."
  explanation: "The evidence is the normalizing constant for the posterior."
  anchor: evidence-as-normalization
- id: bayes-code-1
  type: code
  lang: python
  prompt: "Fill in the posterior computation."
  difficulty: 3
  scaffold: |
    prior = 0.01
    sensitivity = 0.99
    false_positive_rate = 0.05
    evidence = sensitivity * prior + false_positive_rate * (1 - prior)
    posterior = ___
  blanks:
    - id: 1
      answer: "sensitivity * prior / evidence"
      rubric:
        - "Uses likelihood times prior."
        - "Divides by the evidence."
  explanation: "Bayes' theorem gives posterior equals likelihood times prior divided by evidence."
  anchor: code-example
