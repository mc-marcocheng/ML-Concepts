- id: convex-latex-1
  type: latex
  prompt: "Write the definition of convexity for $f$."
  difficulty: 3
  answer: 'f(\lambda x+(1-\lambda)y)\le \lambda f(x)+(1-\lambda)f(y)'
  rubric:
    - "Uses a convex combination of x and y."
    - "Uses lambda between zero and one."
    - "Uses the inequality in the correct direction."
  explanation: "The function value at a convex combination is no larger than the weighted average."
  anchor: core-idea

- id: convex-short-1
  type: short
  prompt: "What does a positive semi-definite Hessian imply for a twice differentiable function?"
  difficulty: 3
  answer: "It implies the function is convex on the domain where the Hessian is positive semi-definite."
  rubric:
    - "Mentions convexity."
    - "Mentions the Hessian condition over the domain."
  explanation: "A positive semi-definite Hessian is the second-order convexity condition."
  anchor: second-order-condition

