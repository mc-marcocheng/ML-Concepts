- id: boost-mcq-1
  type: mcq
  prompt: "Boosting mainly reduces which part of the error?"
  difficulty: 2
  options:
    - "Variance"
    - "Bias"
    - "Irreducible noise"
    - "Label noise"
  correctIndex: 1
  explanation: "Each round adds capacity to correct the current residual error."
  anchor: boosting-versus-bagging
- id: boost-latex-1
  type: latex
  prompt: "Write the AdaBoost weight $\\alpha_m$ in terms of the weighted error $\\epsilon_m$."
  difficulty: 3
  answer: "\\frac{1}{2}\\log\\frac{1-\\epsilon_m}{\\epsilon_m}"
  rubric:
    - "Uses the log odds of the weighted error."
    - "Includes the factor one half."
  explanation: "This value minimizes the exponential loss for the new stage."
  anchor: adaboost
- id: boost-numeric-1
  type: numeric
  prompt: "An AdaBoost weak learner has weighted error 0.2. What is $\\alpha_m$?"
  difficulty: 2
  value: 0.693147
  tolerance: 0.001
  explanation: "$\\alpha = 0.5\\log(0.8/0.2) = 0.5\\log 4 \\approx 0.6931$."
  anchor: adaboost
- id: boost-mcq-2
  type: mcq
  prompt: "For squared error loss, what does each gradient boosting tree fit?"
  difficulty: 2
  options:
    - "The original targets"
    - "The current residuals $y_i - F(x_i)$"
    - "The class probabilities"
    - "The sample weights"
  correctIndex: 1
  explanation: "The negative gradient of squared loss is the residual."
  anchor: gradient-boosting
- id: boost-latex-2
  type: latex
  prompt: "Write the optimal XGBoost leaf value using the sums of gradients $G$ and Hessians $H$ with L2 penalty $\\lambda$."
  difficulty: 4
  answer: "-\\frac{G}{H + \\lambda}"
  rubric:
    - "Puts the gradient sum in the numerator with a negative sign."
    - "Puts the Hessian sum plus lambda in the denominator."
  explanation: "This minimizes the second order approximation of the loss for that leaf."
  anchor: second-order-boosting
- id: boost-short-1
  type: short
  prompt: "Why can boosting overfit while bagging cannot?"
  difficulty: 3
  answer: "Boosting fits each new learner to the current errors, so every round adds capacity and drives the training loss down. Bagging averages independent models, which only reduces variance and does not increase capacity."
  rubric:
    - "States that boosting is sequential and adds capacity."
    - "States that bagging averages independent models."
  explanation: "Boosting needs early stopping, bagging does not."
  anchor: boosting-versus-bagging
- id: boost-short-2
  type: short
  prompt: "What is the role of the learning rate in gradient boosting?"
  difficulty: 2
  answer: "It shrinks the contribution of each tree. A smaller rate needs more rounds but usually generalizes better because no single tree dominates."
  rubric:
    - "States that it scales each tree contribution."
    - "Notes the tradeoff with the number of rounds."
  explanation: "Shrinkage is one of the strongest regularizers in boosting."
  anchor: regularization
- id: boost-code-1
  type: code
  lang: python
  prompt: "Fill in the pseudo-residual and the ensemble update for squared loss gradient boosting."
  difficulty: 3
  scaffold: |
    residual = ___
    tree = DecisionTreeRegressor(max_depth=depth).fit(X, residual)
    F = ___
  blanks:
    - id: 1
      answer: "y - F"
      rubric:
        - "Uses the current residual as the target."
    - id: 2
      answer: "F + lr * tree.predict(X)"
      rubric:
        - "Adds the shrunk tree prediction to the ensemble."
  explanation: "Squared loss makes the negative gradient equal to the residual."
  anchor: code-example
- id: boost-order-1
  type: order
  prompt: "Order one round of gradient boosting."
  difficulty: 2
  steps:
    - "Compute the negative gradient of the loss at the current predictions"
    - "Fit a regression tree to those pseudo-residuals"
    - "Choose leaf values by a line search on the loss"
    - "Add the shrunk tree to the ensemble"
  explanation: "Gradient boosting is gradient descent in function space."
  anchor: gradient-boosting
