- id: gd-latex-1
  type: latex
  prompt: "Write the basic gradient descent update."
  difficulty: 2
  answer: '\theta_{t+1}=\theta_t-\eta\nabla_\theta L(\theta_t)'
  rubric:
    - "Includes the old parameter."
    - "Subtracts the learning rate times the gradient."
  explanation: "The update moves opposite the gradient."
  anchor: core-idea

- id: gd-code-1
  type: code
  lang: python
  prompt: "Fill in the parameter update."
  difficulty: 1
  scaffold: |
    theta = ___
  blanks:
    - id: 1
      answer: "theta - lr * grad"
      rubric:
        - "Subtracts the scaled gradient."
  explanation: "Minimization uses theta minus learning rate times gradient."
  anchor: code-example

- id: gd-short-1
  type: short
  prompt: "Why can SGD updates be noisy?"
  difficulty: 2
  answer: "SGD estimates the full gradient from a mini-batch instead of all examples."
  rubric:
    - "Mentions mini-batches."
    - "Mentions gradient estimation."
  explanation: "A mini-batch gives an unbiased but noisy gradient estimate in common settings."
  anchor: sgd
