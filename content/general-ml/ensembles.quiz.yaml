- id: ens-latex-1
  type: latex
  prompt: "Write the ambiguity decomposition of the squared error of a uniform average $\\bar{f}$."
  difficulty: 4
  answer: "(\\bar{f}-y)^2 = \\frac{1}{M}\\sum_m (f_m-y)^2 - \\frac{1}{M}\\sum_m (f_m-\\bar{f})^2"
  rubric:
    - "Expresses the ensemble error using the average member error."
    - "Subtracts the spread of members around their mean."
  explanation: "The cross term vanishes because the mean deviation is zero."
  anchor: ambiguity-decomposition
- id: ens-mcq-1
  type: mcq
  prompt: "Why must stacking use out-of-fold base predictions?"
  difficulty: 3
  options:
    - "To save memory"
    - "To avoid leaking training labels into the meta model features"
    - "To increase the number of folds"
    - "To ensure the base models are diverse"
  correctIndex: 1
