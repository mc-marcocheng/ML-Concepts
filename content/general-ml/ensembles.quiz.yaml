  anchor: stacking
- id: ens-mcq-2
  type: mcq
  prompt: "Which source of ensemble diversity works for deep networks even with the same architecture and data?"
  difficulty: 2
  options:
    - "Different random initializations and data order"
    - "Different loss functions only"
    - "Different learning rate decay only"
    - "Different label sets"
  correctIndex: 0
  explanation: "The loss surface has many distinct minima, so seeds alone give diverse members."
  anchor: where-diversity-comes-from
- id: ens-short-1
  type: short
  prompt: "Why is a diverse ensemble better than a set of near identical models?"
  difficulty: 2
  answer: "The ambiguity term grows with member disagreement, and it is subtracted from the average member error. Identical models have zero ambiguity, so the ensemble equals a single model."
  rubric:
    - "Mentions that disagreement reduces the ensemble error."
    - "Notes that identical members give no gain."
  explanation: "Errors must be at least partly uncorrelated to cancel."
  anchor: ambiguity-decomposition
- id: ens-short-2
  type: short
  prompt: "Name one cost of ensembling and one way to recover it."
  difficulty: 2
  answer: "Inference cost grows with the number of members. Knowledge distillation trains one student model to match the ensemble output and keeps most of the accuracy at single model cost."
  rubric:
    - "Names the multiplied training or inference cost."
    - "Names distillation or a similar compression method."
  explanation: "Distillation transfers ensemble behaviour into one network."
  anchor: cost-and-value
