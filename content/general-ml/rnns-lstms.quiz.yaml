- id: rnn-mcq-1
  type: mcq
  prompt: "What causes vanishing gradients in a vanilla RNN?"
  difficulty: 2
  options:
    - "The loss function is non-convex"
    - "Repeated multiplication of Jacobians with spectral norm below one"
    - "The hidden state is too large"
    - "The learning rate is too small"
  correctIndex: 1
  explanation: "The product over time steps decays geometrically when the factor is below one."
  anchor: vanishing-and-exploding-gradients
- id: rnn-latex-1
  type: latex
  prompt: "Write the LSTM cell state update using the forget gate $f_t$, input gate $i_t$, and candidate $\\tilde{c}_t$."
  difficulty: 2
  answer: "c_t = f_t \\odot c_{t-1} + i_t \\odot \\tilde{c}_t"
  rubric:
    - "Multiplies the previous cell state by the forget gate."
    - "Adds the input gate times the candidate."
  explanation: "The additive path is what preserves gradients."
  anchor: lstm
- id: rnn-short-1
  type: short
  prompt: "Why does the LSTM cell state preserve gradients better than a vanilla RNN hidden state?"
  difficulty: 4
  answer: "The cell state update is additive and its Jacobian is roughly the diagonal forget gate. When the forget gate stays near one, the gradient passes through many steps almost unchanged instead of being multiplied by a weight matrix each step."
  rubric:
    - "Mentions the additive update and the diagonal forget gate Jacobian."
    - "Contrasts with repeated multiplication by a weight matrix."
  explanation: "This path is called the constant error carousel."
  anchor: why-the-lstm-helps
- id: rnn-numeric-1
  type: numeric
  prompt: "An LSTM has hidden size 128 and input size 64. How many weight and bias parameters does the cell have, counting $4H(H+D)+4H$?"
  difficulty: 3
  value: 98816
  tolerance: 0.5
  explanation: "$4\\cdot128\\cdot192 + 4\\cdot128 = 98304 + 512 = 98816$."
  anchor: parameter-counts
- id: rnn-mcq-2
  type: mcq
  prompt: "Why is the forget gate bias often initialized to a positive value?"
  difficulty: 3
  options:
    - "To make the gate saturate at zero and forget quickly"
    - "To start the gate near one so the cell remembers by default"
    - "To break symmetry between gates"
    - "To reduce the parameter count"
  correctIndex: 1
  explanation: "A positive bias makes the sigmoid output near one at the start of training."
  anchor: why-the-lstm-helps
- id: rnn-short-2
  type: short
  prompt: "Why did transformers replace RNNs for large scale sequence training?"
  difficulty: 3
  answer: "An RNN must process steps in order, so training cannot parallelize over the time axis. Attention computes all positions at once and gives a constant length path between any two tokens."
  rubric:
    - "States the sequential training bottleneck."
    - "Mentions parallelism or shorter dependency paths."
  explanation: "The tradeoff is quadratic cost in the sequence length."
  anchor: comparison-with-attention-and-ssms
- id: rnn-code-1
  type: code
  lang: python
  prompt: "Fill in the LSTM cell state and hidden state updates."
  difficulty: 3
  scaffold: |
    i = sigmoid(z[0:H])
    f = sigmoid(z[H:2 * H])
    g = np.tanh(z[2 * H:3 * H])
    o = sigmoid(z[3 * H:4 * H])
    c_new = ___
    h_new = ___
  blanks:
    - id: 1
      answer: "f * c + i * g"
      rubric:
        - "Combines the gated previous cell state with the gated candidate."
    - id: 2
      answer: "o * np.tanh(c_new)"
      rubric:
        - "Applies the output gate to the squashed cell state."
  explanation: "The hidden state is a gated view of the cell state."
  anchor: code-example
- id: rnn-mcq-3
  type: mcq
  prompt: "Gradient clipping addresses which problem?"
  difficulty: 1
  options:
    - "Vanishing gradients"
    - "Exploding gradients"
    - "Overfitting"
    - "Slow inference"
  correctIndex: 1
  explanation: "Clipping bounds the update norm but cannot recover a gradient that has already decayed."
  anchor: vanishing-and-exploding-gradients
