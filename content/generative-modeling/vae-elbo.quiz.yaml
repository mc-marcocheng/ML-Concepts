      answer: "mu + torch.exp(0.5 * logvar) * eps"
      rubric:
        - "Uses the mean."
        - "Converts log variance to standard deviation."
        - "Multiplies the standard deviation by noise."
  explanation: "The standard deviation is $\\exp(0.5\\cdot\\text{logvar})$."
