- id: gans-latex-1
  type: latex
  prompt: "Write the optimal discriminator for a fixed generator."
  difficulty: 3
  answer: '\frac{p_{\text{data}}(x)}{p_{\text{data}}(x)+p_g(x)}'
  rubric:
    - "Includes the data density in the numerator."
    - "Includes the sum of data and generator densities in the denominator."
  explanation: "For a fixed generator, $D^*(x)=p_{\\text{data}}(x)/(p_{\\text{data}}(x)+p_g(x))$."
  anchor: optimal-discriminator

- id: gans-short-1
  type: short
  prompt: "What is mode collapse?"
  difficulty: 3
  answer: "Mode collapse happens when the generator produces too few sample types and misses parts of the data distribution."
  rubric:
    - "Mentions low diversity."
    - "Mentions missing modes or parts of the data distribution."
  explanation: "A collapsed generator can make sharp samples but still cover too little of the data distribution."
  anchor: stability-problems

