- id: score-mcq-1
  type: mcq
  prompt: "What is the score function of a continuous density $p(x)$?"
  difficulty: 1
  options:
    - "$p(x)$"
    - "$\\log p(x)$"
    - "$\\nabla_x \\log p(x)$"
    - "$\\int p(x)dx$"
  correctIndex: 2
  explanation: "The score is the gradient of log density with respect to the sample."
  anchor: core-idea

- id: score-latex-1
  type: latex
  prompt: "Write the score of a one-dimensional normal distribution with mean $\\mu$ and variance $\\sigma^2$."
  difficulty: 3
  answer: '-\frac{x-\mu}{\sigma^2}'
  rubric:
    - "Has a negative sign."
    - "Uses the residual $x-\\mu$."
    - "Divides by the variance."
  explanation: "For a normal density, $\\nabla_x\\log p(x)=-(x-\\mu)/\\sigma^2$."
  anchor: code-example

- id: score-numeric-1
  type: numeric
  prompt: "For $x=2$, $\\mu=0$, and $\\sigma=2$, what is the normal score?"
  difficulty: 2
  value: -0.5
  tolerance: 0.000001
  explanation: "The score is $-(2-0)/2^2=-0.5$."
  anchor: code-example

- id: score-short-1
  type: short
  prompt: "Why does the score not depend on the normalizing constant?"
  difficulty: 3
  answer: "The normalizing constant does not depend on x, so its gradient with respect to x is zero."
  rubric:
    - "Mentions that the normalizing constant does not depend on the sample."
    - "Mentions that its gradient is zero."
  explanation: "The score is a gradient with respect to $x$, so constants vanish."
  anchor: core-idea

- id: score-order-1
  type: order
  prompt: "Put the denoising score matching steps in order."
  difficulty: 3
  steps:
    - "Sample clean data"
    - "Add Gaussian noise"
    - "Compute the conditional score target"
    - "Train the score model to match the target"
  explanation: "Denoising score matching learns the score from known Gaussian corruption."
  anchor: denoising-score-matching
