- id: diff-forward-latex-1
  type: latex
  prompt: "Write the closed form sample for $x_t$ from $x_0$."
  difficulty: 3
  answer: '\sqrt{\bar\alpha_t}x_0 + \sqrt{1-\bar\alpha_t}\epsilon'
  rubric:
    - "Includes the clean data scaled by $\\sqrt{\\bar\\alpha_t}$."
    - "Includes Gaussian noise scaled by $\\sqrt{1-\\bar\\alpha_t}$."
  explanation: "The forward process has a direct Gaussian form for any time step."
  anchor: closed-form-sampling

- id: diff-forward-numeric-1
  type: numeric
  prompt: "If $x_0=2$, $\\bar\\alpha_t=0.25$, and $\\epsilon=1$, what is $x_t$?"
  difficulty: 2
  value: 1.866025404
  tolerance: 0.000001
  explanation: "$x_t=\\sqrt{0.25}\\cdot2+\\sqrt{0.75}\\cdot1=1.866025404$."
