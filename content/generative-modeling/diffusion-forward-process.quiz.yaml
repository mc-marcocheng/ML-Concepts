- id: diff-forward-short-1
  type: short
  prompt: "Why does the closed form $q(x_t \\mid x_0)$ help training?"
  difficulty: 3
  answer: "It lets us sample any noisy time step directly from clean data without running all previous forward steps."
  rubric:
    - "Mentions direct sampling of any time step."
    - "Mentions avoiding all earlier noising steps."
  explanation: "The closed form makes training faster and simpler."
  anchor: closed-form-sampling

- id: diff-forward-code-1
  type: code
  lang: python
  prompt: "Fill in the DDPM forward sample."
  difficulty: 3
  scaffold: |
    noise = torch.randn_like(x0)
    x_t = ___
  blanks:
    - id: 1
      answer: "torch.sqrt(alpha_bar_t) * x0 + torch.sqrt(1 - alpha_bar_t) * noise"
      rubric:
        - "Scales clean data by square root alpha bar."
        - "Scales noise by square root one minus alpha bar."
  explanation: "The closed form combines clean data and Gaussian noise."
  anchor: code-example
