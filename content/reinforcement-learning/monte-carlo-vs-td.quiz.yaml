- id: mctd-mcq-1
  type: mcq
  prompt: "Which method uses a bootstrapped target?"
  difficulty: 2
  options:
    - "Monte Carlo only"
    - "TD learning"
    - "Random search"
    - "Uniform sampling"
  correctIndex: 1
  explanation: "TD targets include current value estimates."
  anchor: core-idea
- id: mctd-latex-1
  type: latex
  prompt: "Write the one-step TD target for $V(s_t)$."
  difficulty: 2
  answer: "r_t+\\gamma V(s_{t+1})"
  rubric:
    - "Includes current reward."
    - "Includes discounted next value."
  explanation: "TD uses reward plus estimated future value."
  anchor: core-idea
- id: mctd-short-1
  type: short
  prompt: "Give one bias-variance difference between Monte Carlo and TD targets."
  difficulty: 3
  answer: "Monte Carlo returns are unbiased but can have high variance. TD targets can be biased but often have lower variance."
  rubric:
    - "Mentions Monte Carlo high variance or unbiasedness."
    - "Mentions TD bias or lower variance."
  explanation: "Bootstrapping changes both bias and variance."
  anchor: bias-and-variance
- id: mctd-order-1
  type: order
  prompt: "Put the Monte Carlo value update steps in order."
  difficulty: 2
  steps:
    - "Run an episode"
    - "Compute returns"
    - "Compare each return with the value estimate"
    - "Update the value estimate"
  explanation: "Monte Carlo learning uses complete returns from finished episodes."
  anchor: episode-requirements
