- id: ppo-mcq-1
  type: mcq
  prompt: "What does PPO clip?"
  difficulty: 2
  options:
    - "The policy probability ratio"
    - "Only the reward"
    - "The state vector"
    - "The environment transition"
  correctIndex: 0
  explanation: "PPO clips the ratio between new and old action probabilities."
  anchor: core-idea
- id: ppo-latex-1
  type: latex
  prompt: "Write the PPO probability ratio."
  difficulty: 3
  answer: "\\frac{\\pi_\\theta(a_t \\mid s_t)}{\\pi_{\\theta_{\\mathrm{old}}}(a_t \\mid s_t)}"
  rubric:
    - "Uses new policy probability in the numerator."
    - "Uses old policy probability in the denominator."
  explanation: "The ratio measures how much the policy changed on sampled actions."
  anchor: core-idea
- id: ppo-short-1
  type: short
  prompt: "Why does PPO use fresh rollouts after policy updates?"
  difficulty: 4
  answer: "PPO is mostly on-policy, so old rollout data becomes mismatched as the policy changes."
  rubric:
    - "Mentions on-policy data."
    - "Mentions mismatch after policy changes."
  explanation: "Too much reuse makes the data policy too different from the updated policy."
  anchor: common-mistakes
- id: ppo-code-1
  type: code
  lang: python
  prompt: "Fill in the PPO ratio from log probabilities."
  difficulty: 3
  scaffold: |
    ratio = ___
  blanks:
    - id: 1
      answer: "torch.exp(logp_new - logp_old)"
      rubric:
        - "Subtracts old log probability from new log probability."
        - "Exponentiates the log ratio."
  explanation: "A log-probability difference becomes a probability ratio after exponentiation."
  anchor: code-example
