- id: qtd-short-1
  type: short
  prompt: "What is bootstrapping in TD learning?"
  difficulty: 3
  answer: "Bootstrapping means an update target uses a current value estimate for a future state."
  rubric:
    - "Mentions an update target."
    - "Mentions a current estimate of future value."
  explanation: "TD methods use estimates inside targets."
  anchor: why-bootstrapping-helps
