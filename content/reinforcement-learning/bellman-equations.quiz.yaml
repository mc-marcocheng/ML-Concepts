  difficulty: 2
  options:
    - "$r + \\gamma \\max_{a'} Q(s',a')$"
    - "$r - \\gamma Q(s,a)$"
    - "$\\gamma r + Q(s,a)$"
    - "$\\max_a r(s,a)$ only"
  correctIndex: 0
  explanation: "Q-learning uses reward plus discounted best next action value."
