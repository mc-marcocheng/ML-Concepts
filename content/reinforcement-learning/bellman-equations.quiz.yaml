- id: bellman-latex-1
  type: latex
  prompt: "Write the one-step return recursion."
  difficulty: 2
  answer: "G_t=r_t+\\gamma G_{t+1}"
  rubric:
    - "Includes current reward."
    - "Includes discounted next return."
  explanation: "The return separates into the current reward and the discounted future return."
  anchor: core-idea
- id: bellman-short-1
  type: short
  prompt: "What is the main difference between the policy Bellman equation and the optimal Bellman equation?"
  difficulty: 3
  answer: "The policy equation averages over actions from a policy, while the optimal equation takes a maximum over actions."
  rubric:
    - "Mentions averaging under a policy."
    - "Mentions maximization for the optimal equation."
  explanation: "Policy evaluation follows a policy. Optimal control chooses the best action."
  anchor: optimal-bellman-equation
