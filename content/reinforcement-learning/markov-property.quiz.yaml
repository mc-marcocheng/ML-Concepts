- id: markov-mcq-1
  type: mcq
  prompt: "What does the Markov property say?"
  difficulty: 2
  options:
    - "The future depends on the full history only"
    - "The future depends on the past only through the current state"
    - "Rewards must be deterministic"
    - "Actions do not affect transitions"
  correctIndex: 1
  explanation: "A Markov state contains all information needed for the next transition distribution."
  anchor: core-idea
- id: markov-latex-1
  type: latex
  prompt: "Write the Markov transition condition for $s_{t+1}$."
  difficulty: 3
  answer: "p(s_{t+1} \\mid s_t,a_t,s_{t-1},a_{t-1},\\dots)=p(s_{t+1} \\mid s_t,a_t)"
  rubric:
    - "Conditions the left side on history."
    - "Uses only current state and action on the right side."
  explanation: "The current state and action screen off the earlier history."
  anchor: core-idea
- id: markov-short-1
  type: short
  prompt: "Why can a single image frame fail to be Markov?"
  difficulty: 3
  answer: "A single frame may not contain velocity or hidden information needed to predict the next state."
  rubric:
    - "Mentions missing velocity or hidden information."
    - "Mentions prediction of the next state."
  explanation: "Stacked frames or memory can add missing information."
  anchor: state-versus-observation
- id: markov-order-1
  type: order
  prompt: "Put the practical Markov-state check in order."
  difficulty: 2
  steps:
    - "Choose a candidate state"
    - "Compare histories that share that state"
    - "Check whether next-state distributions match"
    - "Add information if the distributions differ"
  explanation: "A Markov state makes earlier history unnecessary for transition prediction."
  anchor: practical-test
