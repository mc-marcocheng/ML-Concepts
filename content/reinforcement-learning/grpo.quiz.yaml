- id: grpo-latex-1
  type: latex
  prompt: "Write a group-normalized reward advantage for response $i$."
  difficulty: 3
  answer: "\\frac{r_i-\\operatorname{mean}(r)}{\\operatorname{std}(r)+\\epsilon}"
  rubric:
    - "Subtracts the group mean."
    - "Divides by group standard deviation plus epsilon."
  explanation: "Group normalization gives a relative reward within one prompt group."
  anchor: group-relative-advantage
- id: grpo-short-1
  type: short
  prompt: "Why can GRPO avoid a learned value critic?"
  difficulty: 4
  answer: "It uses normalized rewards within a group as a baseline and advantage estimate."
  rubric:
    - "Mentions group normalization."
    - "Mentions baseline or advantage."
  explanation: "The group mean acts like a prompt-specific baseline."
  anchor: core-idea
