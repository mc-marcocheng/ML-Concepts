- id: sarsa-short-1
  type: short
  prompt: "Why can SARSA be more cautious than Q-learning under exploration?"
  difficulty: 4
  answer: "SARSA values include future exploratory actions, so risky states can receive lower value when exploration may cause bad actions."
  rubric:
    - "Mentions future exploratory actions."
    - "Mentions lower value for risky states."
  explanation: "Q-learning uses a greedy target. SARSA follows the behavior policy."
  anchor: on-policy-control
