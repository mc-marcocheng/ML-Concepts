  prompt: "Write a simple gated recurrence update."
  difficulty: 3
  answer: 'a_t\odot h_{t-1}+(1-a_t)\odot\tilde{x}_t'
  rubric:
    - "Includes old state h_{t-1}."
    - "Includes a gate a_t."
    - "Includes a candidate input term."
  explanation: "A gate mixes old state with a new candidate."
