- id: causal-short-1
  type: short
  prompt: "Why can a decoder-only model train on a full sequence in parallel?"
  difficulty: 3
  answer: "The causal mask prevents each position from seeing future tokens, so the model can compute all positions at once without leakage."
  rubric:
    - "Mentions parallel computation."
    - "Mentions causal mask."
    - "Mentions no future leakage."
  explanation: "The mask preserves the autoregressive constraint during parallel training."
  anchor: training-versus-generation
