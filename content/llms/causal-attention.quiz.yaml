- id: causal-latex-1
  type: latex
  prompt: "Write masked scaled attention scores using Q, K, d_k, and mask M."
  difficulty: 3
  answer: '\frac{QK^\top}{\sqrt{d_k}}+M'
  rubric:
    - "Includes QK transpose."
    - "Divides by square root of d_k."
    - "Adds the mask."
  explanation: "The mask is added to logits before softmax."
  anchor: masked-attention-formula

- id: causal-numeric-1
