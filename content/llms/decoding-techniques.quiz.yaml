- id: decode-short-1
  type: short
  prompt: "What is the difference between top-k and top-p sampling?"
  difficulty: 3
  answer: "Top-k keeps a fixed number of highest-probability tokens, while top-p keeps the smallest set whose probability mass reaches p."
  rubric:
    - "Mentions fixed number for top-k."
    - "Mentions probability mass for top-p."
    - "Mentions filtering candidate tokens."
  explanation: "Top-k uses a count, while top-p uses cumulative probability."
  anchor: top-k-and-top-p

