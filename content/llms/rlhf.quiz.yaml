  difficulty: 3
  answer: "The KL penalty keeps the optimized policy near the reference model and reduces reward hacking or distribution drift."
  rubric:
    - "Mentions staying near a reference model."
    - "Mentions reward hacking or drift."
    - "Mentions policy optimization."
  explanation: "The KL term constrains the policy update."
