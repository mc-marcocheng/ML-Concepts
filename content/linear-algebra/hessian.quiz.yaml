- id: hes-latex-1
  type: latex
  prompt: "Write the quadratic term in the second-order Taylor approximation."
  difficulty: 3
  answer: '\frac{1}{2}\Delta x^\top H_f(x)\Delta x'
  rubric:
    - "Includes the factor $1/2$."
    - "Includes $\\Delta x^\\top H_f(x)\\Delta x$."
  explanation: "The Hessian appears in the quadratic curvature term."
  anchor: curvature

- id: hes-numeric-1
