- id: hes-short-1
  type: short
  prompt: "What does a negative Hessian eigenvalue at a critical point imply?"
  difficulty: 3
  answer: "It implies there is a direction of negative curvature, so the point is not a local minimum."
  rubric:
    - "Mentions negative curvature."
    - "States that the point is not a local minimum."
  explanation: "A negative eigenvalue gives a direction that locally decreases the function."
  anchor: eigenvalue-view

- id: hes-code-1
  type: code
  lang: python
  prompt: "Fill in the Hessian for $f(x)=x^T A x$."
  difficulty: 3
  scaffold: |
    import numpy as np
    A = np.array([[2.0, 1.0],
                  [0.0, 3.0]])
    H = ___
  blanks:
    - id: 1
      answer: "A + A.T"
      rubric:
        - "Adds $A$ and its transpose."
  explanation: "For $x^T A x$, the Hessian is $A + A^T$."
