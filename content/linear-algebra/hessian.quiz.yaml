  prompt: "For $f(x,y)=x^2+3y^2$, what is $\\frac{\\partial^2 f}{\\partial y^2}$?"
  difficulty: 1
  value: 6
  tolerance: 0.000001
  explanation: "The second derivative of $3y^2$ with respect to $y$ is 6."
