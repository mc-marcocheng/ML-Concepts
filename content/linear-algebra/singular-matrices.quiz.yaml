- id: sing-short-1
  type: short
  prompt: "Why does a nonzero null-space vector make a square matrix singular?"
  difficulty: 3
  answer: "A nonzero input maps to zero, so the map loses information and cannot be reversed."
  rubric:
    - "Mentions a nonzero input maps to zero."
    - "Mentions information loss or no inverse."
  explanation: "An inverse cannot recover which nonzero vector mapped to zero."
  anchor: equivalent-views

- id: sing-code-1
  type: code
  lang: python
  prompt: "Fill in the rank-based singularity check."
  difficulty: 2
  scaffold: |
    import numpy as np
    A = np.array([[1.0, 2.0],
                  [2.0, 4.0]])
    rank = np.linalg.matrix_rank(A)
    is_singular = ___
  blanks:
    - id: 1
      answer: "rank < A.shape[0]"
      rubric:
        - "Compares rank with the square matrix size."
  explanation: "A square matrix is singular when its rank is less than its size."
