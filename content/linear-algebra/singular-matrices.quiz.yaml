- id: sing-numeric-1
  type: numeric
  prompt: "Compute the determinant of $\\begin{bmatrix}1 & 2 \\\\ 2 & 4\\end{bmatrix}$."
  difficulty: 1
  value: 0
  tolerance: 0.000001
  explanation: "The determinant is $1\\cdot4 - 2\\cdot2 = 0$."
