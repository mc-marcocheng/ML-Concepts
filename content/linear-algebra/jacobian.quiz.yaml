- id: jac-mcq-1
  type: mcq
  prompt: "For $f:\\mathbb{R}^n \\to \\mathbb{R}^m$, what is the shape of the Jacobian?"
  difficulty: 2
  options:
    - "$n \\times m$"
    - "$m \\times n$"
    - "$n \\times n$"
    - "$m \\times m$"
  correctIndex: 1
  explanation: "The Jacobian has one row per output and one column per input."
  anchor: core-idea

- id: jac-latex-1
  type: latex
  prompt: "Write the local linear approximation using the Jacobian."
  difficulty: 3
  answer: 'f(x+\Delta x)\approx f(x)+J_f(x)\Delta x'
  rubric:
    - "Includes $f(x)$."
    - "Includes $J_f(x)\\Delta x$."
  explanation: "The Jacobian gives the first-order local linear term."
  anchor: local-linear-approximation

- id: jac-numeric-1
  type: numeric
  prompt: "For $f(x,y)=(x^2+y,xy)$ at $(2,3)$, what is $\\partial f_2/\\partial x$?"
  difficulty: 2
  value: 3
  tolerance: 0.000001
  explanation: "$f_2=xy$, so $\\partial f_2/\\partial x=y=3$."
  anchor: code-example

