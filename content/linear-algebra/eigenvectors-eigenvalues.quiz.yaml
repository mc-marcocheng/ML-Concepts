- id: eig-mcq-1
  type: mcq
  prompt: "What defines an eigenvector of a square matrix $A$?"
  difficulty: 2
  options:
    - "A nonzero vector $v$ such that $Av=\\lambda v$"
    - "Any vector in the null space"
    - "Any vector with norm one"
    - "A row of the matrix"
  correctIndex: 0
  explanation: "An eigenvector keeps its direction under the matrix."
  anchor: core-idea

- id: eig-latex-1
  type: latex
  prompt: "Write the characteristic equation for eigenvalues of $A$."
  difficulty: 3
  answer: '\det(A-\lambda I)=0'
  rubric:
    - "Uses $A-\\lambda I$."
    - "Sets the determinant equal to zero."
  explanation: "Eigenvalues make $A-\\lambda I$ singular."
  anchor: characteristic-equation

