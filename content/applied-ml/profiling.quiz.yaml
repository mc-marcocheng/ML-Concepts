  prompt: "Why should a profiling loop include warmup steps?"
  difficulty: 2
  answer: "Warmup avoids one-time costs such as compilation, memory allocation, and kernel caching."
  rubric:
    - "Mentions one-time costs."
    - "Mentions compilation, allocation, or caching."
  explanation: "Warmup makes measured steps more representative."
  anchor: profiling-loop

