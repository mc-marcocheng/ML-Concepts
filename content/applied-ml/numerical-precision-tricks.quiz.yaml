- id: num-latex-1
  type: latex
  prompt: "Write the stable log-sum-exp identity using $m=\\max_i x_i$."
  difficulty: 3
  answer: "m + \\log \\sum_i \\exp(x_i - m)"
  rubric:
    - "Includes m outside the logarithm."
    - "Subtracts m inside the exponential."
    - "Uses a sum over i."
  explanation: "This form avoids exponentiating very large values."
  anchor: log-sum-exp

- id: num-short-1
  type: short
  prompt: "Why can subtracting nearly equal floating point numbers be dangerous?"
  difficulty: 3
  answer: "It can cause cancellation, where leading digits cancel and the result loses relative precision."
  rubric:
    - "Mentions cancellation."
    - "Mentions loss of relative precision."
  explanation: "Cancellation makes small differences unreliable when inputs are close."
  anchor: core-idea

- id: num-code-1
